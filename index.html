<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            width: 1000px;
            height: 500px;
            border: solid red 2px;
            margin: auto;
            position: relative;
        }

        .child {
            width: 100px;
            height: 100px;
            background-color: green;
            position: absolute;
            top: 0px;
            left: 0px;
            transition: 2s;
        }
        .main:hover .child{
             left: 900px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="child"></div>
    </div>
</body>

</html>
